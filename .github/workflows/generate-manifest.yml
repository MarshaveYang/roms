name: Generate ROM manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'games.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          python3 - <<'EOF'
          import json, os

          # 扩展名 -> EmulatorJS 核心名称，以后想支持别的机型在这里加一行
          EXT_TO_CORE = {
              "nes": "nes", "fds": "nes", "unif": "nes", "unf": "nes",
              "sfc": "snes", "smc": "snes", "fig": "snes",
              "gb": "gb",
              "gbc": "gbc",
              "gba": "gba",
          }

          games = []
          for fname in sorted(os.listdir(".")):
              if not os.path.isfile(fname):
                  continue
              ext = fname.rsplit(".", 1)[-1].lower() if "." in fname else ""
              if ext not in EXT_TO_CORE:
                  continue
              name = fname.rsplit(".", 1)[0]
              games.append({
                  "name": name,
                  "file": fname,
                  "core": EXT_TO_CORE[ext],
              })

          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(games, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Wrote games.json with {len(games)} games")
          EOF

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update games.json [skip ci]"
          git push
